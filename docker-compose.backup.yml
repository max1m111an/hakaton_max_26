services:
  maxbot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_SCHEME: postgres
    depends_on:
      database:
        condition: service_healthy
    networks:
      - local

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:?Set DB_USER in .env}"
      POSTGRES_PASSWORD: "${DB_PASS:?Set DB_PASS in .env}"
      POSTGRES_DB: "${DB_NAME:?Set DB_NAME in .env}"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - "./database/dumps:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - local

  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    environment:
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - local

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: database
      PGPORT: 5432
      PGUSER: "${DB_USER:?Set DB_USER in .env}"
      PGPASSWORD: "${DB_PASS:?Set DB_PASS in .env}"
      PGDATABASE: "${DB_NAME:?Set DB_NAME in .env}"
    volumes:
      - "./database/backups:/backup"
    depends_on:
      database:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        echo "Waiting for database..."
        until pg_isready -q -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" -d "$$PGDATABASE"; do
          sleep 5
        done
        echo "Database is ready"
        while true; do
          backup_file="/backup/backup_$$(date +%Y%m%d_%H%M%S).sql.gz"
          if pg_dump --host "$$PGHOST" --port "$$PGPORT" --username "$$PGUSER" --dbname "$$PGDATABASE" --format=plain --no-owner --no-privileges | gzip > "$$backup_file"; then
            find /backup -type f -name '*.gz' -mtime +7 -delete
          else
            rm -f "$$backup_file"
          fi
          sleep 21600
        done
    networks:
      - local

networks:
  local:

volumes:
  postgres_data:
