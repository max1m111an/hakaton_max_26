services:
  maxbot:
    build:
      context: .
      target: maxbot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ".env"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - local

  database:
    build:
      context: .
      target: database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:?Set DB_USER in .env}"
      POSTGRES_PASSWORD: "${DB_PASS:?Set DB_PASS in .env}"
      POSTGRES_DB: "${DB_NAME:?Set DB_NAME in .env}"
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - "./database/dumps:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - local

  adminer:
    build:
      context: .
      target: adminer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADMINER_DESIGN: galkaev
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - local

networks:
  local:

volumes:
  postgres_data:
